name: Hourly Crypto Scanner

on:
  schedule:
    # Tự động chạy vào phút 00 của mỗi giờ (24/7 trên Cloud)
    - cron: '0 * * * *'
  workflow_dispatch: # Nút bấm để anh có thể chạy thử bất cứ lúc nào

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v3

      - name: Cài đặt Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cài thư viện
        run: pip install requests pandas numpy

      - name: Chạy quét thị trường
        run: python bot.py
